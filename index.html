<!doctype html>

  <link rel="stylesheet" href="/src/styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <svg class="mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2 L20 7 L20 17 L12 22 L4 17 L4 7 Z"/></svg>

      <div>
        <div class="group-label">Collections</div>
        <nav id="navCollections">

      </div>

    <div class="main-col">
